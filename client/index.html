
<!doctype html>
<html lang="en">
  <head>
    <!-- =====================================================
         BASIC HTML
    ====================================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =====================================================
         FAVICON
    ====================================================== -->

   

    <!-- =====================================================
         SEO TITLE
    ====================================================== -->

    <title>
      NOVA – Full Stack Project Management System
    </title>

    <!-- =====================================================
         META DESCRIPTION
    ====================================================== -->

    <meta
      name="description"
      content="NOVA is a full-stack project management system for managing projects, tasks, users, comments, notifications, analytics, and team collaboration."
    />

    <!-- =====================================================
         KEYWORDS
         NOTE: Google does not use meta keywords for ranking.
    ====================================================== -->

    <meta
      name="keywords"
      content="NOVA project management, project management system, task management, team collaboration, full stack project management, MERN project, project tracking, task tracker, team management, dashboard"
    />

    <!-- =====================================================
         AUTHOR
    ====================================================== -->

    <meta
      name="author"
      content="Abdus Samad"
    />

    <!-- =====================================================
         SEARCH ENGINE ROBOTS
    ====================================================== -->

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- =====================================================
         CANONICAL URL
         Replace with your actual Netlify URL.
    ====================================================== -->

    <link
      rel="canonical"
      href="https://YOUR-NETLIFY-SITE.netlify.app/"
    />

    <!-- =====================================================
         OPEN GRAPH
         Facebook, LinkedIn, WhatsApp, etc.
    ====================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="NOVA – Full Stack Project Management System"
    />

    <meta
      property="og:description"
      content="Manage projects, tasks, users, comments, notifications, analytics, and team collaboration with NOVA."
    />

    <meta
      property="og:url"
      content="https://YOUR-NETLIFY-SITE.netlify.app/"
    />

    <meta
      property="og:site_name"
      content="NOVA"
    />

    <meta
      property="og:image"
      content="https://YOUR-NETLIFY-SITE.netlify.app/og-image.png"
    />

    <!-- =====================================================
         TWITTER / X
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="NOVA – Full Stack Project Management System"
    />

    <meta
      name="twitter:description"
      content="A full-stack project management platform for projects, tasks, users, notifications, analytics, and team collaboration."
    />

    <meta
      name="twitter:image"
      content="https://YOUR-NETLIFY-SITE.netlify.app/og-image.png"
    />

    <!-- =====================================================
         THEME COLOR
    ====================================================== -->

    <meta
      name="theme-color"
      content="#0f172a"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
